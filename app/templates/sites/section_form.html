{% extends "base.html" %}

{% block title %}栏目配置 - 建筑资质公开信息监测与归档系统{% endblock %}

{% block content %}
<header class="topbar">
  <div>
    <h1>{{ "编辑栏目" if section else "新增栏目" }}</h1>
    <p>{{ site.name }}</p>
  </div>
  <div class="topbar-actions">
    <a class="text-action" href="/sites">返回网站栏目</a>
  </div>
</header>

<section class="content-narrow">
  <form class="panel form-panel" method="post" action="{{ '/sections/' ~ section.id ~ '/edit' if section else '/sites/' ~ site.id ~ '/sections' }}">
    <div class="panel-title">
      <h2>栏目基础信息</h2>
      <span>抓取入口</span>
    </div>
    {% if error %}
    <div class="form-error">{{ error }}</div>
    {% endif %}
    <div class="form-grid">
      <label>
        <span>栏目名称</span>
        <input name="name" value="{{ section.name if section else '' }}" required>
      </label>
      <label>
        <span>信息类型</span>
        <select name="item_type">
          {% for item_type in item_types %}
          <option value="{{ item_type }}" {% if section and section.item_type == item_type %}selected{% endif %}>{{ item_type }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="wide">
        <span>栏目地址</span>
        <input name="url" type="url" value="{{ section.url if section else '' }}" required>
      </label>
      <label>
        <span>爬虫策略</span>
        <select name="crawler_strategy">
          {% for strategy in crawler_strategies %}
          <option value="{{ strategy }}" {% if section and section.crawler_strategy == strategy %}selected{% endif %}>{{ strategy }}</option>
          {% endfor %}
        </select>
      </label>
      <label>
        <span>抓取方式</span>
        <input name="crawl_method" value="{{ section.crawl_method if section else 'http' }}">
      </label>
      <label>
        <span>定时规则</span>
        <input name="schedule_cron" value="{{ section.schedule_cron if section else '0 9 * * *' }}">
      </label>
      <label>
        <span>超时秒数</span>
        <input name="request_timeout" type="number" min="1" value="{{ section.request_timeout if section else 20 }}">
      </label>
      <label>
        <span>重试次数</span>
        <input name="retry_times" type="number" min="0" value="{{ section.retry_times if section else 2 }}">
      </label>
      <label>
        <span>请求间隔秒</span>
        <input name="request_interval_seconds" type="number" min="0" value="{{ section.request_interval_seconds if section else 3 }}">
      </label>
      <label>
        <span>最大页数</span>
        <input name="max_pages" type="number" min="1" value="{{ section.max_pages if section else 3 }}">
      </label>
      <label>
        <span>单次最大条数</span>
        <input name="max_items_per_run" type="number" min="1" value="{{ section.max_items_per_run if section else 100 }}">
      </label>
      <label>
        <span>抓取日期窗口</span>
        <input name="crawl_date_window_days" type="number" min="1" value="{{ section.crawl_date_window_days if section else 1 }}">
      </label>
      <label class="wide">
        <span>请求头 JSON</span>
        <textarea name="request_headers" rows="3">{{ section.request_headers if section else "" }}</textarea>
      </label>
    </div>

    <div class="panel-title nested">
      <h2>解析规则</h2>
      <span>CSS 选择器</span>
    </div>
    <div class="form-grid">
      <label>
        <span>列表选择器</span>
        <input name="list_selector" value="{{ section.list_selector if section else '' }}">
      </label>
      <label>
        <span>标题选择器</span>
        <input name="title_selector" value="{{ section.title_selector if section else '' }}">
      </label>
      <label>
        <span>日期选择器</span>
        <input name="date_selector" value="{{ section.date_selector if section else '' }}">
      </label>
      <label>
        <span>详情链接选择器</span>
        <input name="detail_url_selector" value="{{ section.detail_url_selector if section else '' }}">
      </label>
      <label>
        <span>正文选择器</span>
        <input name="content_selector" value="{{ section.content_selector if section else '' }}">
      </label>
      <label>
        <span>附件选择器</span>
        <input name="attachment_selector" value="{{ section.attachment_selector if section else '' }}">
      </label>
      <label class="wide">
        <span>分页规则</span>
        <textarea name="pagination_rule" rows="3">{{ section.pagination_rule if section else "" }}</textarea>
      </label>
      <label>
        <span>定制适配器</span>
        <input name="custom_adapter" value="{{ section.custom_adapter if section else '' }}">
      </label>
      <label>
        <span>连续已存在停止数</span>
        <input name="stop_when_seen_existing_count" type="number" min="1" value="{{ section.stop_when_seen_existing_count if section else 20 }}">
      </label>
      <label class="check-line">
        <input name="enabled" type="checkbox" {% if not section or section.enabled %}checked{% endif %}>
        <span>启用</span>
      </label>
      <label class="check-line">
        <input name="download_attachments" type="checkbox" {% if not section or section.download_attachments %}checked{% endif %}>
        <span>下载附件</span>
      </label>
      <label class="check-line">
        <input name="save_snapshot" type="checkbox" {% if not section or section.save_snapshot %}checked{% endif %}>
        <span>保存快照</span>
      </label>
      <label class="check-line">
        <input name="allow_full_crawl" type="checkbox" {% if section and section.allow_full_crawl %}checked{% endif %}>
        <span>允许全量抓取</span>
      </label>
    </div>
    <button type="submit">保存栏目</button>
  </form>
</section>
{% endblock %}
