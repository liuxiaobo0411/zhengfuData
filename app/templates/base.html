<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}建筑资质公开信息监测与归档系统{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div>
          <div class="brand-title">资质公开监测</div>
          <div class="brand-subtitle">ZhengfuData</div>
        </div>
      </div>
      <nav class="nav">
        <a class="nav-item {% if active_nav == 'dashboard' %}active{% endif %}" href="/">工作台</a>
        <a class="nav-item {% if active_nav == 'announcements' %}active{% endif %}" href="/announcements">抓取信息</a>
        <a class="nav-item {% if active_nav == 'attachments' %}active{% endif %}" href="/attachments">附件管理</a>
        <a class="nav-item {% if active_nav == 'crawl_runs' %}active{% endif %}" href="/crawl-runs">抓取任务</a>
        <a class="nav-item {% if active_nav == 'sites' %}active{% endif %}" href="/sites">网站栏目</a>
        <a class="nav-item" href="#">通知日志</a>
        <a class="nav-item" href="#">系统配置</a>
      </nav>
      {% if user %}
      <form class="logout-form" method="post" action="/logout">
        <span>{{ user.username }}</span>
        <button type="submit">退出</button>
      </form>
      {% endif %}
    </aside>
    <main class="shell">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
