name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

  windows-smoke:
    name: Windows deployment smoke
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Run Windows setup script
        shell: pwsh
        run: scripts\windows\setup.ps1 -PythonCommand python

      - name: Run Windows doctor script
        shell: pwsh
        run: scripts\windows\doctor.ps1

      - name: Run Windows local acceptance script
        shell: pwsh
        run: scripts\windows\run-local-acceptance.ps1 -SkipSourceValidation -SkipDailyCrawl -SkipV2

      - name: Export Windows deployment package
        shell: pwsh
        run: scripts\windows\export-deployment-package.ps1 -Output exports\ci_windows_deployment.zip

      - name: Verify exported Windows deployment package
        shell: pwsh
        run: scripts\windows\verify-deployment-package.ps1 -PackagePath exports\ci_windows_deployment.zip -PythonCommand python -WorkRoot "$env:RUNNER_TEMP\zhengfudata-package-check"

      - name: Upload verified Windows deployment package
        uses: actions/upload-artifact@v4
        with:
          name: zhengfudata-windows-deployment
          path: exports/ci_windows_deployment.zip
          if-no-files-found: error
          retention-days: 14

  ubuntu-smoke:
    name: Ubuntu local acceptance smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Prepare local database
        run: |
          mkdir -p data storage
          python -m alembic upgrade head
          python -m app.cli import-sites --file configs/sites.yaml

      - name: Run local acceptance script
        run: scripts/run-local-acceptance.sh --skip-source-validation --skip-daily-crawl --skip-v2

      - name: Export deployment package
        run: scripts/export-deployment-package.sh --output /tmp/zhengfudata_ci_deployment.zip
